description: RGB LED widget indicator behavior

compatible: "zmk,behavior-rgbled-widget"

include: zero_param.yaml

properties:
  indicate-battery:
    type: boolean
  indicate-connectivity:
    type: boolean
  indicate-layer:
    type: boolean
  led-gpios:
    type: phandle-array
    description: |
      Ignored compatibility property for older shield nodes that configured
      discrete GPIO LEDs. The underglow backend uses zmk,underglow instead.
