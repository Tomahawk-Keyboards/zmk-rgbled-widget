# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: xiao_ble//zmk
    shield: hummingbird rgbled_adapter
  - board: xiao_ble//zmk
    shield: hummingbird rgbled_adapter
    artifact-name: xiao-ble-widget-features-soc
    cmake-args: >-
      -DCONFIG_ZMK_BATTERY_REPORTING=y
      -DCONFIG_ZMK_SLEEP=y
      -DCONFIG_RGBLED_WIDGET_PAIRING_LED=y
      -DCONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
  - board: xiao_ble//zmk
    shield: hummingbird rgbled_adapter
    artifact-name: xiao-ble-widget-features-voltage
    cmake-args: >-
      -DCONFIG_ZMK_BATTERY_REPORTING=y
      -DCONFIG_ZMK_SLEEP=y
      -DCONFIG_RGBLED_WIDGET_PAIRING_LED=y
      -DCONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
  - board: xiao_rp2040//zmk
    shield: hummingbird rgbled_adapter
